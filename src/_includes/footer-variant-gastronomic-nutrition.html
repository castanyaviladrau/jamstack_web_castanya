{% set lang = page.url | pageLang %}
<section
  class="professionals-value-feature__cta"
  aria-labelledby="gastronomic-nutrition-cta-title"
>
  <img
    src="/assets/images/gallery/espai-gastronomic/espai_gastronomic_bg.jpg"
    alt="{{ i18n[lang].gastroCtaImgAlt }}"
    class="professionals-value-feature__cta-image"
  />
  <div class="professionals-value-feature__cta-overlay"></div>

  <div class="professionals-value-feature__cta-content block-content-style">
    <h3
      id="gastronomic-nutrition-cta-title"
      class="professionals-value-feature__cta-title hero-title-elegant light"
    >
      {{ i18n[lang].nutritionCtaTitle }}
    </h3>

    <p class="professionals-value-feature__cta-text hero-text-body light">
      {{ i18n[lang].nutritionCtaText }}
    </p>

    <div class="professionals-value-feature__cta-actions">
      <a
        href="{% if lang == 'es' %}/es/gastronomic/receptes/{% elif lang == 'en' %}/en/gastronomic/receptes/{% else %}/gastronomic/receptes/{% endif %}"
        class="professionals-value-feature__cta-button professionals-value-feature__cta-button--primary"
        >{{ i18n[lang].nutritionCtaButton }}</a
      >
    </div>
  </div>
</section>

<div class="newsletter-bar">
  <div class="footer-container flex-newsletter">
    <div class="newsletter-copy">
      <h2 class="newsletter-heading">{{ i18n[lang].newsletterHeading }}</h2>
      <p class="newsletter-text">
        {{ i18n[lang].newsletterText }}
      </p>
    </div>
    <div class="newsletter-form">
      <input type="email" class="newsletter-input-field" placeholder="" />
      <button type="submit" class="btn-newsletter-submit">{{ i18n[lang].newsletterButton }}</button>
    </div>
  </div>
</div>
